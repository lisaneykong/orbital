name: Publish website to IONOS

# Auto-uploads the Orbital website to jobs.lisaney.com (IONOS) every time you
# change the repo — so you NEVER manually upload to IONOS again.
#
# IONOS's "Secure FTP" is actually SFTP over SSH (port 22), not classic FTP/FTPS —
# confirmed from IONOS → Hosting → your site → Connection data (Protocol: SFTP + SSH).
# Plain FTP/FTPS against that host fails with "500 'AUTH': command unrecognized"
# because the server simply doesn't speak FTP at all.
#
# ONE-TIME SETUP (in your GitHub repo → Settings → Secrets and variables → Actions):
#   IONOS_FTP_SERVER   = Server/Host from IONOS Connection data (e.g. home703391031.1and1-data.host)
#   IONOS_FTP_USERNAME = User name from IONOS Connection data (e.g. u90902675)
#   IONOS_FTP_PASSWORD = the password you set for that SFTP/SSH user
#   IONOS_REMOTE_PATH  = OPTIONAL. The folder that actually holds the live site, if the
#                        SFTP login does not land in it (defaults to /).
# (Find these in IONOS → Hosting → your site → SFTP, SSH & WebDAV → Connection data.)
#
# After that: any push to the repo re-publishes the site automatically. You can also
# run it by hand from the Actions tab → "Publish website to IONOS" → Run workflow.
#
# TWO BUGS FIXED (both caused "GitHub isn't publishing to IONOS"):
#  1. local_path was './_publish/*'. A shell glob does NOT match dotfiles, so .htaccess
#     was silently never uploaded — which is why the no-cache rules in it were never in
#     effect on the live site and every deploy looked stale. Now uploads the directory.
#  2. The `paths:` filter only republished on a handful of files. Editing anything else
#     (install-guide.html, tools.html, this workflow) looked like a failed publish
#     because no run was ever triggered. The filter is gone: every push publishes.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

# Never let two publishes race each other onto the same web root.
concurrency:
  group: ionos-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage only the public website files (keep scraper/.github off the live site)
        run: |
          mkdir -p _publish
          for f in index.html setup.html install-guide.html START-HERE.html tools.html \
                   manifest.json orbital-logo.png orbital-config.js companies.json \
                   coverage-seattle-la.html score-proof.html token-probe.html \
                   heal-probe.html .htaccess; do
            [ -f "$f" ] && cp "$f" _publish/ && echo "  + $f"
          done
          [ -d assets ] && cp -r assets _publish/ || true
          # .htaccess is a dotfile: GitHub's drag-and-drop uploader hides it, so it is easy
          # to have a repo with no .htaccess at all. Then this loop silently skips it and the
          # no-cache rules never reach the server — every publish looks stale in the browser.
          if [ ! -f .htaccess ]; then
            echo "::warning::.htaccess is missing from the repo, so the no-cache rules cannot be published and browsers will keep serving a cached index.html. Add it with GitHub > Add file > Create new file and type .htaccess as the filename."
          fi
          # Publish stamp so you can confirm from a browser which upload is live:
          # open jobs.lisaney.com/build.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ  ${GITHUB_SHA}" > _publish/build.txt
          # version.json is what every page polls (no-store) to notice it is running a
          # stale cached copy and reload itself. It MUST match the orbital-build meta in
          # index.html, so it is read out of the file rather than hand-maintained.
          BUILD=$(sed -n 's/.*name="orbital-build" content="\([^"]*\)".*/\1/p' index.html | head -1)
          if [ -z "$BUILD" ]; then echo "::error::no orbital-build meta in index.html"; exit 1; fi
          printf '{"build":"%s","commit":"%s","published":"%s"}\n' \
            "$BUILD" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > _publish/version.json
          echo "Build stamp: $BUILD"
          echo "Staged for upload:" && ls -a _publish

      # A publish that cannot possibly work should fail LOUDLY here rather than show a
      # green check while nothing reaches the server.
      - name: Check the IONOS secrets are actually set
        env:
          H: ${{ secrets.IONOS_FTP_SERVER }}
          U: ${{ secrets.IONOS_FTP_USERNAME }}
          P: ${{ secrets.IONOS_FTP_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$H" ] && MISSING="$MISSING IONOS_FTP_SERVER"
          [ -z "$U" ] && MISSING="$MISSING IONOS_FTP_USERNAME"
          [ -z "$P" ] && MISSING="$MISSING IONOS_FTP_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Repo secrets not set:$MISSING — Settings > Secrets and variables > Actions. Nothing can publish until these exist."
            exit 1
          fi
          echo "All three IONOS secrets are present."

      # Where an SFTP login lands is NOT necessarily the folder the web server serves.
      # This prints the real remote layout into the run log, so a publish that "succeeds"
      # into the wrong directory is visible instead of silent.
      - name: Show where SFTP actually lands (diagnostic)
        continue-on-error: true
        env:
          H: ${{ secrets.IONOS_FTP_SERVER }}
          U: ${{ secrets.IONOS_FTP_USERNAME }}
          P: ${{ secrets.IONOS_FTP_PASSWORD }}
          RP: ${{ secrets.IONOS_REMOTE_PATH || '/' }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y sshpass
          printf 'pwd\nls -la\nls -la %s\nbye\n' "$RP" > /tmp/probe.sftp
          echo "Login home, then the configured remote_path ($RP):"
          sshpass -p "$P" sftp -oStrictHostKeyChecking=no -oUserKnownHostsFile=/dev/null \
            -P 22 -b /tmp/probe.sftp "$U@$H" || echo "(probe failed — read the error above)"

      - name: Upload website to IONOS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.IONOS_FTP_SERVER }}
          username: ${{ secrets.IONOS_FTP_USERNAME }}
          password: ${{ secrets.IONOS_FTP_PASSWORD }}
          port: 22
          # Trailing slash, no glob — a '*' glob skips dotfiles and left .htaccess behind.
          local_path: './_publish/'
          # The SSH login folder is often NOT the docroot. If the verify step below fails,
          # read the diagnostic listing above, find the folder that holds the live site
          # (IONOS > Hosting > your site shows it too), and set it as the optional secret
          # IONOS_REMOTE_PATH — no YAML edit needed.
          remote_path: ${{ secrets.IONOS_REMOTE_PATH || '/' }}
          sftp_only: true
          delete_remote_files: false

      # The upload action reports success as soon as the bytes are written to whatever
      # folder it was pointed at. Only the live URL proves a publish happened, so ask it.
      - name: Verify the live site is serving this commit
        run: |
          URL="https://jobs.lisaney.com/build.txt?cb=${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5 6; do
            BODY="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$URL" || true)"
            echo "attempt $i: ${BODY:-<no response>}"
            case "$BODY" in
              *"${GITHUB_SHA}"*)
                echo "Live site is serving ${GITHUB_SHA}. Publish confirmed."
                exit 0;;
            esac
            sleep 10
          done
          echo "::error::Bytes uploaded, but https://jobs.lisaney.com/build.txt is not serving ${GITHUB_SHA}. The upload almost certainly went to a folder the web server does not serve. Read the 'Show where SFTP actually lands' log above, then set the IONOS_REMOTE_PATH secret to the folder that holds the live index.html."
          exit 1
