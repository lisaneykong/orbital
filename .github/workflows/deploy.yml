name: Publish website to IONOS

# Auto-uploads the Orbital website to jobs.lisaney.com (IONOS) on every push.
#
# IONOS's "Secure FTP" is SFTP over SSH (port 22), not FTP/FTPS — plain FTP fails with
# "500 'AUTH': command unrecognized" because the server does not speak FTP at all.
#
# ONE-TIME SETUP (repo → Settings → Secrets and variables → Actions):
#   IONOS_FTP_SERVER   = Server/Host from IONOS Connection data (e.g. home703391031.1and1-data.host)
#   IONOS_FTP_USERNAME = User name from IONOS Connection data (e.g. acc1355230686)
#   IONOS_FTP_PASSWORD = the password for that SFTP user
#   IONOS_REMOTE_PATH  = OPTIONAL. Only needed if auto-detection picks the wrong folder.
#                        Note IONOS scopes each SFTP user to a directory ("Directory"
#                        column): for a user jailed to /jobs, its own root IS /jobs, so
#                        this should stay unset rather than being set to /jobs.
#
# WHY THIS DOES THE TRANSFER BY HAND rather than with a marketplace action:
#   wlixcc/SFTP-Deploy-Action runs `put -r ./_publish/ <remote>`, which copies the FOLDER
#   into the target — everything landed in <remote>/_publish/, so the live URLs 404'd.
#   Uploading the folder's CONTENTS instead needs a './_publish/*' glob, and a shell glob
#   skips dotfiles, which silently dropped .htaccess (the file that carries the no-cache
#   rules). Enumerating the files with find avoids both traps.
#
# The site folder is DETECTED, not assumed: whichever candidate directory already holds an
# index.html is the one the web server serves. A wrong IONOS_REMOTE_PATH self-corrects.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

# Never let two publishes race each other onto the same web root.
concurrency:
  group: ionos-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage only the public website files (keep scraper/.github off the live site)
        run: |
          mkdir -p _publish
          for f in index.html setup.html install-guide.html START-HERE.html tools.html \
                   manifest.json orbital-logo.png orbital-config.js companies.json \
                   coverage-seattle-la.html score-proof.html token-probe.html \
                   heal-probe.html .htaccess; do
            [ -f "$f" ] && cp "$f" _publish/ && echo "  + $f"
          done
          [ -d assets ] && cp -r assets _publish/ || true
          if [ ! -f .htaccess ]; then
            echo "::warning::.htaccess is missing from the repo, so the no-cache rules cannot be published and browsers will keep serving a cached index.html. Add it with GitHub > Add file > Create new file and type .htaccess as the filename."
          fi
          # Publish stamp — the live proof of which commit is being served:
          # open jobs.lisaney.com/build.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ  ${GITHUB_SHA}" > _publish/build.txt
          # version.json is what every page polls (no-store) to notice it is running a
          # stale cached copy and reload itself. It MUST match the orbital-build meta in
          # index.html, so it is read out of the file rather than hand-maintained.
          BUILD=$(sed -n 's/.*name="orbital-build" content="\([^"]*\)".*/\1/p' index.html | head -1)
          if [ -z "$BUILD" ]; then echo "::error::no orbital-build meta in index.html"; exit 1; fi
          printf '{"build":"%s","commit":"%s","published":"%s"}\n' \
            "$BUILD" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > _publish/version.json
          echo "Build stamp: $BUILD"
          echo "Staged for upload:" && ls -a _publish

      # A publish that cannot possibly work should fail LOUDLY here rather than show a
      # green check while nothing reaches the server.
      - name: Check the IONOS secrets are actually set
        env:
          H: ${{ secrets.IONOS_FTP_SERVER }}
          U: ${{ secrets.IONOS_FTP_USERNAME }}
          P: ${{ secrets.IONOS_FTP_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$H" ] && MISSING="$MISSING IONOS_FTP_SERVER"
          [ -z "$U" ] && MISSING="$MISSING IONOS_FTP_USERNAME"
          [ -z "$P" ] && MISSING="$MISSING IONOS_FTP_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Repo secrets not set:$MISSING — Settings > Secrets and variables > Actions. Nothing can publish until these exist."
            exit 1
          fi
          echo "All three IONOS secrets are present."

      - name: Upload to IONOS (detects the site folder, keeps dotfiles)
        env:
          H: ${{ secrets.IONOS_FTP_SERVER }}
          U: ${{ secrets.IONOS_FTP_USERNAME }}
          P: ${{ secrets.IONOS_FTP_PASSWORD }}
          RP: ${{ secrets.IONOS_REMOTE_PATH }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y sshpass

          # -oBatchMode=no matters: `sftp -b` turns BatchMode ON by default, which disables
          # password authentication entirely, and sshpass then has nothing to answer —
          # that is the "Permission denied (publickey,password)" this step used to print.
          sf(){ sshpass -p "$P" sftp -oBatchMode=no -oStrictHostKeyChecking=no \
                  -oUserKnownHostsFile=/dev/null -P 22 -b "$1" "$U@$H" 2>&1; }

          probe(){ printf 'ls -la %s\nbye\n' "$1" > /tmp/probe.sftp; sf /tmp/probe.sftp; }

          echo "== login home =="
          probe . || true

          TARGET=""
          for c in "$RP" / /jobs /htdocs /html; do
            [ -z "$c" ] && continue
            echo "== candidate $c =="
            OUT="$(probe "$c" || true)"
            echo "$OUT"
            case "$OUT" in *index.html*) TARGET="$c"; break;; esac
          done

          if [ -z "$TARGET" ]; then
            echo "::error::Could not find a folder holding index.html on the server. Read the listings above, then set IONOS_REMOTE_PATH to the folder that serves jobs.lisaney.com."
            exit 1
          fi
          echo "Publishing into: $TARGET   (user $U)"

          # Explicit per-file puts: dotfiles included, directories created first.
          # A leading '-' on mkdir tells sftp to carry on when the folder already exists.
          B=/tmp/upload.sftp
          : > "$B"
          ( cd _publish && find . -mindepth 1 -type d -printf '%P\n' ) | while read -r d; do
            echo "-mkdir $TARGET/$d" >> "$B"
          done
          ( cd _publish && find . -type f -printf '%P\n' ) | while read -r f; do
            echo "put _publish/$f $TARGET/$f" >> "$B"
          done
          echo "ls -la $TARGET" >> "$B"
          echo "bye" >> "$B"
          echo "Transferring $(grep -c '^put ' "$B") files into $TARGET"
          sf "$B"

      # The transfer above reports success as soon as the bytes are written. Only the live
      # URL proves a publish happened, so ask the website itself.
      - name: Verify the live site is serving this commit
        run: |
          URL="https://jobs.lisaney.com/build.txt?cb=${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5 6; do
            BODY="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$URL" || true)"
            echo "attempt $i: ${BODY:-<no response>}"
            case "$BODY" in
              *"${GITHUB_SHA}"*)
                echo "Live site is serving ${GITHUB_SHA}. Publish confirmed."
                exit 0;;
            esac
            sleep 10
          done
          echo "::error::Bytes uploaded, but https://jobs.lisaney.com/build.txt is not serving ${GITHUB_SHA}. Read the folder listings in the upload step: the directory that received build.txt is not the one jobs.lisaney.com serves. Set IONOS_REMOTE_PATH to the correct folder."
          exit 1
