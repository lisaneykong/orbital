name: Orbital daily email

# Sends the daily brief to EMAIL_TO (default one@lisaney.com) at 8:00 AM Central: every
# role first posted by an employer in the last 24 hours, the Apply Queue, and your
# application progress. The 6am scrape and auto-prepare have finished by then.
#
# ONE-TIME SETUP (repo → Settings → Secrets and variables → Actions):
#   RESEND_API_KEY  = API key from resend.com (free tier: 100 emails/day)
#   EMAIL_FROM      = OPTIONAL. Defaults to "Orbital <onboarding@resend.dev>", which Resend
#                     only delivers to the email your Resend account is registered with.
#                     To send from your own domain, verify lisaney.com in Resend (it gives
#                     you DNS records to add in IONOS) and set e.g. Orbital <orbital@lisaney.com>
#   EMAIL_TO        = OPTIONAL. Defaults to one@lisaney.com
# Plus SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY, which the scraper already uses.
#
# Test it any time: Actions → Orbital daily email → Run workflow. Mode "send" (the default) sends now; "preview" builds the
# email and attaches it to the run without sending.

on:
  schedule:
    # Off the hour, because GitHub starts on-the-hour schedules hours late. The first slot
    # that starts at or after 8am Chicago sends; email_log stops any second send that day.
    # (UTC 13:23 is 8:23am CDT; 14:23 is 8:23am CST; the others are fallbacks.)
    - cron: "23 13 * * *"
    - cron: "23 14 * * *"
    - cron: "53 15 * * *"
    - cron: "53 17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "send = send now · preview = build and attach, don't send"
        type: choice
        default: send
        options: [send, preview]

concurrency:
  group: orbital-email
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          hour=$(TZ=America/Chicago date +%H)
          echo "Chicago time: $(TZ=America/Chicago date '+%Y-%m-%d %H:%M %Z')"
          # 8am or later: a late-starting slot still sends; email_log stops a second send.
          if [ "$hour" \< "08" ]; then echo "Before 8am in Chicago — the other DST slot. Skipping."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          [ "$hour" != "08" ] && echo "late=1" >> "$GITHUB_OUTPUT" || true

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "22"

      - name: Build and send the daily brief
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          LATE_SLOT: ${{ steps.gate.outputs.late }}
        run: |
          if [ "${{ inputs.mode }}" = "preview" ]; then
            node automation/daily-email.mjs --preview
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node automation/daily-email.mjs --force
          else
            node automation/daily-email.mjs
          fi

      - name: Attach the email as it was built
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: email-preview
          path: automation/out/email-preview.html
          if-no-files-found: ignore
